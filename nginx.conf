# Nginx config for shabbat.olami.moscow
# - Serves the React widget (static SPA)
# - Proxies /sb/* to Supabase REST/Storage/Auth (so the browser never
#   talks directly to *.supabase.co — that domain is throttled on RU
#   networks).
# - Proxies /sb/realtime/* with WebSocket Upgrade headers so the
#   realtime channel works too (Vercel rewrites can't do this).

server {
    listen 80;
    listen [::]:80;
    server_name shabbat.olami.moscow;

    root /var/www/shabbat;
    index index.html;

    # Cache hashed asset bundles for a long time — filenames change on
    # each deploy so cache invalidation is automatic.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /favicon.svg {
        expires 7d;
        try_files $uri =404;
    }

    # Realtime WebSocket — must come BEFORE the generic /sb/ block so
    # the more specific match wins. Otherwise nginx would route the
    # upgrade through the non-WS proxy block.
    location /sb/realtime/ {
        proxy_pass https://exfcmcatowfmyouxqgpo.supabase.co/realtime/;
        proxy_http_version 1.1;
        proxy_set_header Host exfcmcatowfmyouxqgpo.supabase.co;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout 86400;
    }

    # Generic Supabase proxy: REST, Storage (posters), Auth, Edge funcs.
    # proxy_buffering off so streaming responses (NDJSON, large GETs)
    # arrive at the client without being held in nginx memory.
    location /sb/ {
        proxy_pass https://exfcmcatowfmyouxqgpo.supabase.co/;
        proxy_http_version 1.1;
        proxy_set_header Host exfcmcatowfmyouxqgpo.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # SPA fallback — every non-asset path serves index.html so React
    # router can handle /widget, /admin, etc. on the client side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
