<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интерактивные ноты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #f5d76e;
    --gold-dark: #c8941a;
    --line-gap: clamp(26px, 3.3vw, 44px);   /* расстояние между линиями стана */
    --note-size: clamp(76px, 9.5vw, 130px); /* диаметр головки ноты */
    --staff-top: clamp(80px, 9vw, 130px);   /* верхний отступ до 1-й линии */
  }

  body {
    min-height: 100vh;
    font-family: 'Georgia', serif;
    background: radial-gradient(ellipse at top, #1a1a3e 0%, #0a0a1a 60%, #000 100%);
    color: #f5f0e1;
    overflow-x: hidden;
    position: relative;
    padding: 40px 20px;
  }

  /* Звёздное небо */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 50% 70%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 80% 10%, #fff, transparent),
      radial-gradient(1px 1px at 90% 60%, #fff, transparent),
      radial-gradient(2px 2px at 10% 80%, #fff, transparent),
      radial-gradient(1px 1px at 70% 90%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 30% 50%, #fff, transparent),
      radial-gradient(1px 1px at 60% 20%, #fff, transparent);
    opacity: 0.6;
    animation: twinkle 4s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes twinkle {
    from { opacity: 0.4; }
    to { opacity: 0.8; }
  }

  h1 {
    text-align: center;
    font-size: clamp(34px, 6vw, 60px);
    margin-bottom: 14px;
    background: linear-gradient(135deg, #f5d76e 0%, #e8a317 50%, #f5d76e 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
    position: relative;
    z-index: 1;
  }

  .subtitle {
    text-align: center;
    color: #c0b8a0;
    font-style: italic;
    margin-bottom: 50px;
    font-size: 18px;
    position: relative;
    z-index: 1;
  }

  /* ---------- НОТНЫЙ СТАН ---------- */

  .staff-wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px clamp(10px, 2vw, 30px) 30px;
    position: relative;
    z-index: 1;
  }

  .staff {
    position: relative;
    width: 100%;
    height: calc(var(--staff-top) + var(--line-gap) * 4 + var(--note-size) + 40px);
    margin: 0 auto;
  }

  /* Пять линий стана */
  .staff-lines {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--staff-top);
    height: calc(var(--line-gap) * 4);
  }

  .staff-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(245, 215, 110, 0.6) 8%,
      rgba(245, 215, 110, 0.7) 92%,
      transparent 100%);
    box-shadow: 0 0 8px rgba(245, 215, 110, 0.3);
  }

  .staff-line:nth-child(1) { top: 0; }
  .staff-line:nth-child(2) { top: var(--line-gap); }
  .staff-line:nth-child(3) { top: calc(var(--line-gap) * 2); }
  .staff-line:nth-child(4) { top: calc(var(--line-gap) * 3); }
  .staff-line:nth-child(5) { top: calc(var(--line-gap) * 4); }

  /* Скрипичный ключ — юникод-глиф */
  .clef {
    position: absolute;
    left: 0;
    top: var(--staff-top);
    height: calc(var(--line-gap) * 4);
    width: calc(var(--line-gap) * 3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bravura Text', 'Noto Music', 'Apple Symbols', 'Segoe UI Symbol', serif;
    font-size: calc(var(--line-gap) * 7);
    line-height: 1;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(245, 215, 110, 0.6);
    pointer-events: none;
    user-select: none;
  }

  /* Тактовая черта в начале и в конце */
  .barline {
    position: absolute;
    top: var(--staff-top);
    height: calc(var(--line-gap) * 4);
    width: 2px;
    background: rgba(245, 215, 110, 0.7);
  }
  .barline.start { left: calc(var(--line-gap) * 3 + 8px); }
  .barline.end { right: 0; width: 4px; box-shadow: -6px 0 0 -2px rgba(245, 215, 110, 0.7); }

  /* ---------- НОТЫ ---------- */

  .note {
    position: absolute;
    width: var(--note-size);
    height: var(--note-size);
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 2;
  }

  /* Позиции нот: по горизонтали и вертикали (на стане в скрипичном ключе) */
  /* Линии (сверху вниз): 1=Фа5, 2=Ре5, 3=Си4, 4=Соль4, 5=Ми4 */
  /* top = 100px + N * line-gap, где N считается от верхней линии */
  /* Центр головки = top + var(--note-size)/2 должен попадать на линию или в пробел */

  .note[data-note="До"]   { left: 13%;  top: calc(var(--staff-top) + var(--line-gap) * 5 - var(--note-size) / 2); z-index: 9; } /* добавочная снизу */
  .note[data-note="Ре"]   { left: 25%;  top: calc(var(--staff-top) + var(--line-gap) * 4.5 - var(--note-size) / 2); z-index: 8; }
  .note[data-note="Ми"]   { left: 37%;  top: calc(var(--staff-top) + var(--line-gap) * 4 - var(--note-size) / 2); z-index: 7; } /* нижняя линия */
  .note[data-note="Фа"]   { left: 49%;  top: calc(var(--staff-top) + var(--line-gap) * 3.5 - var(--note-size) / 2); z-index: 6; }
  .note[data-note="Соль"] { left: 61%;  top: calc(var(--staff-top) + var(--line-gap) * 3 - var(--note-size) / 2); z-index: 5; }   /* 2-я линия */
  .note[data-note="Ля"]   { left: 73%;  top: calc(var(--staff-top) + var(--line-gap) * 2.5 - var(--note-size) / 2); z-index: 4; }
  .note[data-note="Си"]   { left: 85%;  top: calc(var(--staff-top) + var(--line-gap) * 2 - var(--note-size) / 2); z-index: 3; }   /* средняя линия */

  .note:hover {
    transform: translateY(-8px) scale(1.08);
  }

  .note-circle {
    width: var(--note-size);
    height: var(--note-size);
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff5d4, var(--gold) 40%, var(--gold-dark) 100%);
    box-shadow:
      0 6px 20px rgba(245, 215, 110, 0.5),
      0 0 24px rgba(245, 215, 110, 0.3),
      inset -3px -6px 12px rgba(0,0,0,0.2),
      inset 3px 3px 8px rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    transform: rotate(-18deg); /* лёгкий наклон, как у настоящих нотных головок */
  }

  .note:hover .note-circle {
    box-shadow:
      0 12px 32px rgba(245, 215, 110, 0.7),
      0 0 50px rgba(245, 215, 110, 0.5),
      inset -3px -6px 12px rgba(0,0,0,0.2),
      inset 3px 3px 8px rgba(255,255,255,0.5);
  }

  .note-name {
    font-size: clamp(20px, 2.6vw, 34px);
    font-weight: bold;
    color: #2a1a05;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.4);
    letter-spacing: 0.5px;
    transform: rotate(18deg); /* компенсируем наклон головки */
  }

  /* Штиль ноты */
  .note-stem {
    position: absolute;
    top: calc(var(--note-size) * -0.85);
    right: 6px;
    width: 4px;
    height: var(--note-size);
    background: linear-gradient(180deg, var(--gold-dark), var(--gold));
    border-radius: 1.5px;
  }

  /* Номер ноты (подсказка) */
  .note-number {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(245, 215, 110, 0.15);
    border: 1px solid rgba(245, 215, 110, 0.4);
    color: var(--gold);
    padding: 1px 10px;
    border-radius: 10px;
    font-size: 11px;
    letter-spacing: 1px;
    backdrop-filter: blur(4px);
    font-family: sans-serif;
  }

  /* Добавочная линия для ноты До */
  .ledger-line {
    position: absolute;
    width: calc(var(--note-size) + 20px);
    height: 2px;
    background: rgba(245, 215, 110, 0.7);
    left: -10px;
    top: 50%;
    transform: translateY(-1px);
    box-shadow: 0 0 6px rgba(245, 215, 110, 0.4);
    z-index: -1;
  }

  /* Лёгкое покачивание */
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .note { animation: float 5s ease-in-out infinite; }
  .note:nth-child(2) { animation-delay: 0.3s; }
  .note:nth-child(3) { animation-delay: 0.6s; }
  .note:nth-child(4) { animation-delay: 0.9s; }
  .note:nth-child(5) { animation-delay: 1.2s; }
  .note:nth-child(6) { animation-delay: 1.5s; }
  .note:nth-child(7) { animation-delay: 1.8s; }
  .note:hover { animation-play-state: paused; }

  .note.answered .note-circle {
    background: radial-gradient(circle at 30% 30%, #d4c4a0, #8a7a5a 40%, #4a3a20 100%);
    opacity: 0.5;
  }
  .note.answered:hover { transform: none; }

  /* ---------- МОДАЛЬНОЕ ОКНО ---------- */

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 10, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .overlay.active { display: flex; opacity: 1; }

  .modal {
    max-width: 700px;
    width: 100%;
    background: linear-gradient(145deg, #1a1530 0%, #0a0820 100%);
    border: 2px solid;
    border-image: linear-gradient(135deg, var(--gold), var(--gold-dark), var(--gold)) 1;
    border-radius: 20px;
    padding: 50px 40px;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 100px rgba(245, 215, 110, 0.2);
    transform: scale(0.85);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: center;
  }

  .overlay.active .modal { transform: scale(1); }

  .modal-note {
    font-size: 56px;
    font-weight: bold;
    background: linear-gradient(135deg, var(--gold), #e8a317);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    letter-spacing: 3px;
  }

  .modal-divider {
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 28px;
  }

  .modal-question {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: clamp(18px, 2.2vw, 24px);
    line-height: 1.6;
    font-weight: 400;
    color: #f0e8d0;
    font-style: normal;
    letter-spacing: 0.2px;
  }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 20px;
    background: none;
    border: none;
    color: var(--gold);
    font-size: 32px;
    cursor: pointer;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
  }

  .modal-close:hover { background: rgba(245, 215, 110, 0.15); }

  .footer {
    text-align: center;
    margin-top: 10px;
    color: #c0b8a0;
    font-size: clamp(20px, 2.4vw, 28px);
    font-style: italic;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
    text-shadow: 0 0 14px rgba(245, 215, 110, 0.15);
  }

  .scroll-hint { display: none; }
</style>
</head>
<body>

<h1>♪ Семь нот Леонида Овруцкого ♪</h1>
<p class="subtitle">Нажмите на ноту, чтобы открыть вопрос</p>

<div class="staff-wrap">
  <div class="staff">
    <!-- Скрипичный ключ (юникод музыкального символа) -->
    <div class="clef" aria-hidden="true">&#x1D11E;</div>

    <!-- Тактовые черты -->
    <div class="barline start"></div>
    <div class="barline end"></div>

    <!-- Линии стана -->
    <div class="staff-lines">
      <div class="staff-line"></div>
      <div class="staff-line"></div>
      <div class="staff-line"></div>
      <div class="staff-line"></div>
      <div class="staff-line"></div>
    </div>

    <!-- Ноты -->
    <div class="note" data-note="До" data-question="Когда в маленьком мальчике впервые проснулся большой музыкант? С какой ноты началось формирование вашей души артиста, и кому вы больше всего благодарны за то, что сегодня мы имеем возможность слушать вас?">
      <div class="ledger-line"></div>
      <div class="note-stem"></div>
      <div class="note-circle"><span class="note-name">До</span></div>
      <span class="note-number">1</span>
    </div>

    <div class="note" data-note="Ре" data-question="В 19 лет вы ворвались в мир большой оперы: солист «Геликон-оперы», сложные партии, работа с Кириллом Серебренниковым, маэстро Спиваковым, проекты в Мариинском театре. Что ощущает юноша, так рано прикоснувшийся к вершинам? И как не потерять голову от успеха?">
      <div class="note-stem"></div>
      <div class="note-circle"><span class="note-name">Ре</span></div>
      <span class="note-number">2</span>
    </div>

    <div class="note" data-note="Ми" data-question="Вы создали группу «Кватро» и 20 лет были её лидером. Что было самым сложным в этой партитуре, и почему после оглушительного успеха вы решили создавать свою сольную мелодию?">
      <div class="note-stem"></div>
      <div class="note-circle"><span class="note-name">Ми</span></div>
      <span class="note-number">3</span>
    </div>

    <div class="note" data-note="Фа" data-question="Вы придумали «8 историй под звёздным небом». Что произошло в вашей душе, когда вы подумали соединить живую музыку, человеческие истории и бесконечный звёздный купол Планетария?">
      <div class="note-stem"></div>
      <div class="note-circle"><span class="note-name">Фа</span></div>
      <span class="note-number">4</span>
    </div>

    <div class="note" data-note="Соль" data-question="Вы успешный певец, композитор, продюсер, человек многочисленных талантов. Как вы ощущаете природу своего таланта, где его истоки?">
      <div class="note-stem"></div>
      <div class="note-circle"><span class="note-name">Соль</span></div>
      <span class="note-number">5</span>
    </div>

    <div class="note" data-note="Ля" data-question="В 19 лет вы стали солистом «Геликон-оперы», исполнив одну из самых сложных партий XX века в опере Альбана Берга «Лулу». А в жизни какая «ария» — отцовство, брак или творчество — требует от вас наибольшей выносливости?">
      <div class="note-stem"></div>
      <div class="note-circle"><span class="note-name">Ля</span></div>
      <span class="note-number">6</span>
    </div>

    <div class="note" data-note="Си" data-question="Был ли в вашей жизни «божественный аккорд» — момент, когда вы ясно почувствовали присутствие Бога, и это изменило вашу жизнь?">
      <div class="note-stem"></div>
      <div class="note-circle"><span class="note-name">Си</span></div>
      <span class="note-number">7</span>
    </div>
  </div>
</div>
<p class="scroll-hint">← проведите по нотному стану →</p>

<p class="footer">♫ Каждая нота — путь к новой истории ♫</p>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" id="closeBtn" aria-label="Закрыть">×</button>
    <div class="modal-note" id="modalNote">До</div>
    <div class="modal-divider"></div>
    <p class="modal-question" id="modalQuestion"></p>
  </div>
</div>

<script>
  const notes = document.querySelectorAll('.note');
  const overlay = document.getElementById('overlay');
  const modalNote = document.getElementById('modalNote');
  const modalQuestion = document.getElementById('modalQuestion');
  const closeBtn = document.getElementById('closeBtn');

  let audioCtx;
  const frequencies = { 'До': 261.63, 'Ре': 293.66, 'Ми': 329.63, 'Фа': 349.23, 'Соль': 392.00, 'Ля': 440.00, 'Си': 493.88 };

  function playNote(name) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = frequencies[name] || 440;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1.3);
    } catch (e) {}
  }

  function openQuestion(note) {
    const name = note.dataset.note;
    modalNote.textContent = name;
    modalQuestion.textContent = note.dataset.question;
    overlay.classList.add('active');
    playNote(name);
    note.classList.add('answered');
  }

  function closeModal() { overlay.classList.remove('active'); }

  notes.forEach(n => n.addEventListener('click', () => openQuestion(n)));
  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
</script>

</body>
</html>
